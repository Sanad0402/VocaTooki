[pytest]
addopts = -q -ra --strict-markers --maxfail=1
markers =
    login : login test cases
    sanity1: Run sanity1 test cases
    sanity2: Run sanity2 test cases
    sanity3: test
    sanity5:test after rgrission
    activities: activity suite
    test_3: custom bucket
    Start: Test start scene navigation
    newpage: test @pytest.mark.newpage
    stub: auto-generated Rally test that is not implemented yet (skipped). Run "pytest -m 'not stub'" to exclude.