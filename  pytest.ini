[pytest]
markers =
    express: batch gameplay lessons (vending machine activities)
    sanity: start scene navigation and smoke tests
    dialogues: dialogue-based activities
    exams: exam-related tests (3-part lesson)
    map: map page navigation or logic
    dashboard: dashboard stats and analytics
    profile: profile page UI and logic
    login: login and logout flow
    competitions: leaderboard and progress events
    test: test the project  # ✅ NO SPACE!
